services:
  flask:
    build:
      context: ./project/python/front-end
      dockerfile: Dockerfile
    container_name: flask
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    depends_on:
      - mariadb
      - mqtt
    volumes:
      - ./project/python/front-end:/app
    command: python app.py

  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pannenkoek_root
      MYSQL_DATABASE: pancake_science_db
      MYSQL_USER: iot_user
      MYSQL_PASSWORD: pannenkoek
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - mqtt

  myadmin:
    image: phpmyadmin:latest
    container_name: myadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: iot_user
      PMA_PASSWORD: pannenkoek
    depends_on:
      - mariadb

volumes:
  mariadb_data:
  nodered_data:
