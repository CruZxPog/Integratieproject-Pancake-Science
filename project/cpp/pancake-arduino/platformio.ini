; https://docs.platformio.org/page/projectconf.html

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
lib_deps = 
	256dpi/MQTT@^2.5.2
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit MLX90632 Library@^1.0.3
	dfrobot/DFRobot_RGBLCD1602@^2.0.1
monitor_speed = 115200
