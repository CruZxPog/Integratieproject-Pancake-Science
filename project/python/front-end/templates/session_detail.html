<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session detail</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(226, 232, 240, 0.15);
        background: rgba(15, 23, 42, 0.8);
        position: sticky;
        top: 0;
        backdrop-filter: blur(8px);
        z-index: 5;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
      }
      .sub {
        font-size: 13px;
        opacity: 0.8;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid rgba(226, 232, 240, 0.18);
        background: rgba(2, 132, 199, 0.18);
        color: #e2e8f0;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(2, 132, 199, 0.28);
      }
      a {
        color: #93c5fd;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      main {
        padding: 18px 20px 28px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .card {
        background: rgba(30, 41, 59, 0.65);
        border: 1px solid rgba(226, 232, 240, 0.12);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.95;
      }
      .pill {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(226, 232, 240, 0.14);
        background: rgba(15, 23, 42, 0.45);
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
        color: rgba(226, 232, 240, 0.9);
      }
      .chart-wrap {
        margin-top: 12px;
      }
      canvas {
        width: 100% !important;
        height: 440px !important;
      }
      .hint {
        margin-top: 10px;
        font-size: 13px;
        color: rgba(226, 232, 240, 0.75);
      }
      code {
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(226, 232, 240, 0.14);
        padding: 2px 6px;
        border-radius: 8px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>

  <body>
    <header>
      <div class="row">
        <div>
          <div class="title">Session <span id="uiSessionId">-</span></div>
          <div class="sub">Temperatuur grafiek met event markers</div>
        </div>

        <div class="toolbar">
          <a href="/session.html"><button type="button">Terug</button></a>
          <button id="btnReload" type="button">Reload</button>
        </div>
      </div>

      <div class="meta">
        <div class="pill">user_id: <b id="uiUserId">-</b></div>
        <div class="pill">samples: <b id="uiSamples">-</b></div>
        <div class="pill">points: <b id="uiPoints">-</b></div>
      </div>

      <div class="status" id="status">Loading...</div>
    </header>

    <main>
      <div class="card">
        <div style="font-weight: 700; margin-bottom: 6px;">Temperatuur over tijd</div>
        <div class="chart-wrap">
          <canvas id="tempChart"></canvas>
        </div>
        <div class="hint">
          De lijn heeft geen dots. Alleen metingen met <code>event = "point"</code> krijgen een dot.
        </div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const btnReload = document.getElementById("btnReload");

      const uiSessionId = document.getElementById("uiSessionId");
      const uiUserId = document.getElementById("uiUserId");
      const uiSamples = document.getElementById("uiSamples");
      const uiPoints = document.getElementById("uiPoints");

      let chart = null;

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function getParamInt(name) {
        const v = new URLSearchParams(window.location.search).get(name);
        if (!v) return 0;
        const n = parseInt(v, 10);
        return Number.isFinite(n) ? n : 0;
      }

      function getUserId() {
        // priority: URL ?user_id=..., else localStorage user_id
        const fromUrl = getParamInt("user_id");
        if (fromUrl > 0) return fromUrl;

        const fromStorage = localStorage.getItem("user_id");
        if (!fromStorage) return 0;

        const n = parseInt(fromStorage, 10);
        return Number.isFinite(n) ? n : 0;
      }

      function getSessionId() {
        // expects session_id in query string: session_detail.html?session_id=123
        return getParamInt("session_id");
      }

      function normalizeRow(row) {
        // Adapt to whatever your DB returns
        // We try common fields: ts/timestamp/created_at and temp/temperature and event
        const ts = row.ts ?? row.timestamp ?? row.time ?? row.created_at ?? row.createdAt ?? "";
        const temp = row.temperature ?? row.temp ?? row.value ?? null;
        const ev = row.event ?? "";
        return { ts, temp, ev };
      }

      function buildChart(rows) {
        const labels = rows.map(r => String(r.ts));
        const temps = rows.map(r => r.temp);

        // Only show dots where event === "point"
        const pointDots = rows.map(r => (r.ev === "point" ? r.temp : null));
        const pointCount = rows.reduce((acc, r) => acc + (r.ev === "point" ? 1 : 0), 0);

        uiSamples.textContent = String(rows.length);
        uiPoints.textContent = String(pointCount);

        const ctx = document.getElementById("tempChart").getContext("2d");
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Temperature (°C)",
                data: temps,
                borderWidth: 2,
                fill: false,
                pointRadius: 0,
                pointHoverRadius: 0,
                tension: 0.25
              },
              {
                label: "Event: point",
                data: pointDots,
                showLine: false,
                pointRadius: 6,
                pointHoverRadius: 8
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { display: true },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (context.dataset.label === "Event: point") {
                      return "Event: point";
                    }
                    return `Temperature: ${context.raw} °C`;
                  }
                }
              }
            },
            scales: {
              x: { ticks: { maxTicksLimit: 10 } },
              y: { title: { display: true, text: "°C" } }
            }
          }
        });
      }

      async function loadData() {
        const sessionId = getSessionId();
        const userId = getUserId();

        uiSessionId.textContent = sessionId > 0 ? String(sessionId) : "-";
        uiUserId.textContent = userId > 0 ? String(userId) : "-";

        if (sessionId <= 0) {
          setStatus('Missing session_id. Use session_detail.html?session_id=123 (and optionally &user_id=1)');
          return;
        }
        if (userId <= 0) {
          setStatus("Missing user_id. Add ?user_id=... or set localStorage.user_id");
          return;
        }

        const url = `/api/sessions/${sessionId}/measurements?user_id=${encodeURIComponent(userId)}`;

        setStatus("Loading data...");
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            setStatus(`Failed to load: HTTP ${res.status}`);
            return;
          }

          const raw = await res.json();
          const rows = (Array.isArray(raw) ? raw : []).map(normalizeRow).filter(r => r.temp !== null);

          if (rows.length === 0) {
            setStatus("No data to show.");
            uiSamples.textContent = "0";
            uiPoints.textContent = "0";
            if (chart) chart.destroy();
            chart = null;
            return;
          }

          buildChart(rows);
          setStatus(`Loaded ${rows.length} samples.`);
        } catch (e) {
          console.error(e);
          setStatus("Error loading data (check console).");
        }
      }

      btnReload.addEventListener("click", loadData);
      loadData();
    </script>
  </body>
</html>
