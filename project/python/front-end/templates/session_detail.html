<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessie Details</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .action-button {
            margin: 8px;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            background: #2196F3;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        .action-button:hover {
            transform: translateY(-2px);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2196F3;
            color: white;
        }

        tr:hover {
            background: #f2f2f2;
        }

        #chartContainer {
            margin-bottom: 40px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            height: 400px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h2>Sessie Details</h2>

        <!-- Grafiek bovenaan -->
        <div id="chartContainer">
            <canvas id="sessionChart"></canvas>
        </div>

        <!-- Actieknoppen -->
        <button class="action-button" onclick="downloadCSV()">📥 Download data</button>
        <button class="action-button" onclick="toggleChart()">📊 Verberg / Toon grafiek</button>

        <!-- Zoekveld -->
        <input type="text" id="searchInput" placeholder="Zoek op tijd, temperatuur of fase..." onkeyup="filterTable()">

        <!-- Tabel -->
        <table>
            <thead>
                <tr>
                    <th>Tijd</th>
                    <th>Temperatuur (°C)</th>
                    <th>Fase</th>
                </tr>
            </thead>
            <tbody id="measurementTableBody"></tbody>
        </table>

        <button class="action-button" onclick="goBack()">Terug</button>
    </div>

    <script>
        const user_id = localStorage.getItem("user_id");
        const urlParams = new URLSearchParams(window.location.search);
        const session_id = urlParams.get("session_id");

        const tableBodyEl = document.getElementById("measurementTableBody");
        const chartContainer = document.getElementById("chartContainer");

        let measurements = [];
        let chart = null;

        async function loadSessionData() {
            try {
                const res = await fetch(
                    `/api/sessions/${session_id}/measurements?user_id=${user_id}`
                );
                const data = await res.json();

                measurements = data;
                tableBodyEl.innerHTML = "";

                if (data.length === 0) {
                    tableBodyEl.innerHTML = "<tr><td colspan='3'><i>Geen metingen beschikbaar.</i></td></tr>";
                    return;
                }

                // Tabel vullen
                data.forEach(m => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${m.timestamp}</td>
                        <td>${m.temperature}</td>
                        <td>${m.phase}</td>
                    `;
                    tableBodyEl.appendChild(row);
                });

                buildChart();

            } catch (err) {
                console.error(err);
                alert("Fout bij ophalen van data");
            }
        }

        /* ===========================
           📊 GRAFIEK
        =========================== */
        function buildChart() {
            if (measurements.length === 0) return;

            const ctx = document.getElementById("sessionChart").getContext("2d");

            if (chart) chart.destroy();

            const pointColors = measurements.map(m => {
                const eventPhases = ["alarm", "start", "stop"];
                return eventPhases.includes(m.phase.toLowerCase()) ? "red" : "blue";
            });

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: measurements.map(m => m.timestamp),
                    datasets: [{
                        label: "Temperatuur (°C)",
                        data: measurements.map(m => m.temperature),
                        borderWidth: 2,
                        tension: 0.25,
                        pointBackgroundColor: pointColors,
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true }
                    }
                }
            });
        }

        function toggleChart() {
            if (chartContainer.style.display === "none") {
                chartContainer.style.display = "block";
                setTimeout(buildChart, 50);
            } else {
                chartContainer.style.display = "none";
            }
        }

        /* ===========================
           🔍 TABEL FILTER
        =========================== */
        function filterTable() {
            const filter = document.getElementById("searchInput").value.toLowerCase();
            const rows = tableBodyEl.getElementsByTagName("tr");

            for (let row of rows) {
                row.style.display = row.innerText.toLowerCase().includes(filter) ? "" : "none";
            }
        }

        /* ===========================
           📥 CSV EXPORT
        =========================== */
        function downloadCSV() {
            if (measurements.length === 0) return;

            let csv = "timestamp,temperature,phase\n";
            measurements.forEach(m => {
                csv += `${m.timestamp},${m.temperature},${m.phase}\n`;
            });

            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = `session_${session_id}.csv`;
            a.click();

            URL.revokeObjectURL(url);
        }

        function goBack() {
            window.history.back();
        }

        window.onload = loadSessionData;
    </script>

</body>

</html>
