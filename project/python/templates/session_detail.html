<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session detail</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0f0f0;
        margin: 0;
        padding: 20px;
        text-align: center;
        color: #000;
      }

      header {
        background: transparent;
        border: none;
        padding: 0;
        margin-bottom: 20px;
        position: static;
      }

      .row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }

      .title {
        font-size: 22px;
        font-weight: 700;
        color: #000;
      }

      .sub {
        font-size: 14px;
        color: #444;
      }

      .toolbar {
        margin-top: 12px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        padding: 1rem 2rem;
        border: none;
        border-radius: 8px;
        background: #2196F3;
        color: white;
        cursor: pointer;
        font-size: 1rem;
        transition: transform 0.2s, background 0.2s;
      }

      button:hover {
        transform: translateY(-3px);
        background: #1976D2;
      }

      a {
        text-decoration: none;
      }

      main {
        max-width: 900px;
        margin: auto;
        padding: 0;
      }

      .card {
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 0;
      }

      .meta {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin: 20px auto 0;
        max-width: 600px;
      }

      .pill {
        padding: 1rem;
        border-radius: 8px;
        background: #4CAF50;
        color: white;
        font-size: 1rem;
      }

      .status {
        margin-top: 14px;
        font-size: 14px;
        color: #444;
      }

      .chart-wrap {
        margin-top: 20px;
        background: white;
        border-radius: 8px;
        padding: 12px;
      }

      canvas {
        width: 100% !important;
        height: 420px !important;
      }

      .hint {
        margin-top: 10px;
        font-size: 13px;
        color: #555;
      }

      code {
        background: rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(0, 0, 0, 0.12);
        padding: 2px 6px;
        border-radius: 6px;
        color: #000;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>

  <body>
    <header>
      <div class="row">
        <div>
          <div class="title">Session <span id="uiSessionId">-</span></div>
          <div class="sub">Temperatuur grafiek met event markers</div>
        </div>

        <div class="toolbar">
          <a href="/session.html"><button type="button">Terug</button></a>
          <button id="btnReload" type="button">Reload</button>
          <button id="btnDownloadCsv" type="button">Download CSV</button>
        </div>
      </div>

      <div class="meta">
        <div class="pill">samples: <b id="uiSamples">-</b></div>
        <div class="pill">points: <b id="uiPoints">-</b></div>
      </div>

      <div class="status" id="status">Loading...</div>
    </header>

    <main>
      <div class="card">
        <div class="chart-wrap">
          <canvas id="tempChart"></canvas>
        </div>
        <div class="hint">
          De lijn heeft geen dots. Alleen metingen met <code>event = "point"</code> krijgen een dot.
        </div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const btnReload = document.getElementById("btnReload");
      const btnDownloadCsv = document.getElementById("btnDownloadCsv");

      const uiSessionId = document.getElementById("uiSessionId");
      const uiUserId = document.getElementById("uiUserId");
      const uiSamples = document.getElementById("uiSamples");
      const uiPoints = document.getElementById("uiPoints");

      let chart = null;
      let cachedRows = [];

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function getParamInt(name) {
        const v = new URLSearchParams(window.location.search).get(name);
        if (!v) return 0;
        const n = parseInt(v, 10);
        return Number.isFinite(n) ? n : 0;
      }

      function getUserId() {
        const fromUrl = getParamInt("user_id");
        if (fromUrl > 0) return fromUrl;

        const fromStorage = localStorage.getItem("user_id");
        if (!fromStorage) return 0;

        const n = parseInt(fromStorage, 10);
        return Number.isFinite(n) ? n : 0;
      }

      function getSessionId() {
        return getParamInt("session_id");
      }

      function normalizeRow(row) {
        const ts = row.ts ?? row.timestamp ?? row.time ?? row.created_at ?? row.createdAt ?? "";
        const temp = row.temperature ?? row.temp ?? row.value ?? null;
        const ev = row.event ?? "";
        return { ts, temp, ev };
      }

      function downloadCsv(rows) {
        if (!rows || rows.length === 0) {
          alert("Geen data om te downloaden");
          return;
        }

        const header = ["timestamp", "temperature", "event"];
        const csvLines = [header.join(",")];

        rows.forEach(r => {
          csvLines.push([
            `"${String(r.ts).replaceAll('"', '""')}"`,
            r.temp,
            (r.ev ?? "").toString().replaceAll("\n", " ")
          ].join(","));
        });

        const blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `session_${getSessionId()}_measurements.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function buildChart(rows) {
        const labels = rows.map(r => String(r.ts));
        const temps = rows.map(r => r.temp);

        const pointDots = rows.map(r => (r.ev === "point" ? r.temp : null));
        const pointCount = rows.reduce((acc, r) => acc + (r.ev === "point" ? 1 : 0), 0);

        uiSamples.textContent = String(rows.length);
        uiPoints.textContent = String(pointCount);

        const ctx = document.getElementById("tempChart").getContext("2d");
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Temperature (°C)",
                data: temps,
                borderWidth: 2,
                fill: false,
                pointRadius: 0,
                pointHoverRadius: 0,
                tension: 0.25
              },
              {
                label: "Event: point",
                data: pointDots,
                showLine: false,
                pointRadius: 6,
                pointHoverRadius: 8
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { display: true },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (context.dataset.label === "Event: point") return "Event: point";
                    return `Temperature: ${context.raw} °C`;
                  }
                }
              }
            },
            scales: {
              x: { ticks: { maxTicksLimit: 10 } },
              y: { title: { display: true, text: "°C" } }
            }
          }
        });
      }

      async function loadData() {
        const sessionId = getSessionId();
        const userId = getUserId();

        uiSessionId.textContent = sessionId > 0 ? String(sessionId) : "-";
        uiUserId.textContent = userId > 0 ? String(userId) : "-";

        if (sessionId <= 0) {
          setStatus("Missing session_id. Use session_detail.html?session_id=123 (and optionally &user_id=1)");
          return;
        }
        if (userId <= 0) {
          setStatus("Missing user_id. Add ?user_id=... or set localStorage.user_id");
          return;
        }

        const url = `/api/sessions/${sessionId}/measurements?user_id=${encodeURIComponent(userId)}`;

        setStatus("Loading data...");
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            setStatus(`Failed to load: HTTP ${res.status}`);
            cachedRows = [];
            uiSamples.textContent = "0";
            uiPoints.textContent = "0";
            if (chart) chart.destroy();
            chart = null;
            return;
          }

          const raw = await res.json();
          const rows = (Array.isArray(raw) ? raw : []).map(normalizeRow).filter(r => r.temp !== null);

          cachedRows = rows;

          if (rows.length === 0) {
            setStatus("No data to show.");
            uiSamples.textContent = "0";
            uiPoints.textContent = "0";
            if (chart) chart.destroy();
            chart = null;
            return;
          }

          buildChart(rows);
          setStatus(`Loaded ${rows.length} samples.`);
        } catch (e) {
          console.error(e);
          setStatus("Error loading data (check console).");
          cachedRows = [];
        }
      }

      btnReload.addEventListener("click", loadData);
      btnDownloadCsv.addEventListener("click", () => downloadCsv(cachedRows));

      loadData();
    </script>
  </body>
</html>
