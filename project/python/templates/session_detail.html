<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session detail</title>

  <style>
    /* =========================
      BASE – sessions.html look
    ========================== */
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #000;
    }

    /* Header simpel houden */
    header {
      background: transparent;
      border: none;
      padding: 0;
      margin-bottom: 20px;
      position: static;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #000;
    }

    .sub {
      font-size: 14px;
      color: #444;
    }

    .toolbar {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* Buttons – action-button stijl */
    button {
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      background: #2196F3;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      background: #1976D2;
    }

    a {
      text-decoration: none;
    }

    /* Main container */
    main {
      max-width: 600px;
      margin: auto;
      padding: 0;
    }

    /* Card = gewone container */
    .card {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    /* Meta info als groene cards */
    .meta {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }

    .pill {
      padding: 1rem;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 1rem;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #444;
    }

    /* Chart */
    .chart-wrap {
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      padding: 12px;
    }

    canvas {
      width: 100% !important;
      height: 420px !important;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }

    code {
      background: rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.12);
      padding: 2px 6px;
      border-radius: 6px;
      color: #000;
    }

    /* Extra lijststijl (indien gebruikt) */
    .list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .list-item {
      padding: 1rem;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
      font-size: 1rem;
    }

    .actions-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }
  </style>


    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>

  <body>
    <header>
      <div class="row">
        <div>
          <div class="title">Session <span id="uiSessionId">-</span></div>
          <div class="sub">Temperatuur grafiek met event markers</div>
        </div>

        <div class="toolbar">
          <a href="/session.html"><button type="button">Terug</button></a>
          <button id="btnReload" type="button">Reload</button>
        </div>
      </div>

      <div class="meta">
        <div class="pill">user_id: <b id="uiUserId">-</b></div>
        <div class="pill">samples: <b id="uiSamples">-</b></div>
        <div class="pill">points: <b id="uiPoints">-</b></div>
      </div>

      <div class="status" id="status">Loading...</div>
    </header>

    <main>
      <div class="card">
        <div style="font-weight: 700; margin-bottom: 6px;">Temperatuur over tijd</div>
        <div class="chart-wrap">
          <canvas id="tempChart"></canvas>
        </div>
        <div class="hint">
          De lijn heeft geen dots. Alleen metingen met <code>event = "point"</code> krijgen een dot.
        </div>

        <!-- extra: "sessions.html" look & feel blok -->
        <div class="list" style="margin-top: 18px;">
          <div class="list-item">
            Session ID: <b id="uiSessionId2">-</b> | User ID: <b id="uiUserId2">-</b>
          </div>
          <div class="list-item">
            Samples: <b id="uiSamples2">-</b> | Points: <b id="uiPoints2">-</b>
          </div>
        </div>

        <div class="actions-row">
          <button class="action-button" type="button" onclick="window.location.href='session.html'">
            Terug naar Sessies
          </button>
          <button class="action-button" type="button" id="btnReload2">
            Reload data
          </button>
        </div>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const btnReload = document.getElementById("btnReload");

      const uiSessionId = document.getElementById("uiSessionId");
      const uiUserId = document.getElementById("uiUserId");
      const uiSamples = document.getElementById("uiSamples");
      const uiPoints = document.getElementById("uiPoints");

      // mirrors in the green list items
      const uiSessionId2 = document.getElementById("uiSessionId2");
      const uiUserId2 = document.getElementById("uiUserId2");
      const uiSamples2 = document.getElementById("uiSamples2");
      const uiPoints2 = document.getElementById("uiPoints2");
      const btnReload2 = document.getElementById("btnReload2");

      let chart = null;

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function getParamInt(name) {
        const v = new URLSearchParams(window.location.search).get(name);
        if (!v) return 0;
        const n = parseInt(v, 10);
        return Number.isFinite(n) ? n : 0;
      }

      function getUserId() {
        const fromUrl = getParamInt("user_id");
        if (fromUrl > 0) return fromUrl;

        const fromStorage = localStorage.getItem("user_id");
        if (!fromStorage) return 0;

        const n = parseInt(fromStorage, 10);
        return Number.isFinite(n) ? n : 0;
      }

      function getSessionId() {
        return getParamInt("session_id");
      }

      function normalizeRow(row) {
        const ts = row.ts ?? row.timestamp ?? row.time ?? row.created_at ?? row.createdAt ?? "";
        const temp = row.temperature ?? row.temp ?? row.value ?? null;
        const ev = row.event ?? "";
        return { ts, temp, ev };
      }

      function syncUiMirrors() {
        uiSessionId2.textContent = uiSessionId.textContent;
        uiUserId2.textContent = uiUserId.textContent;
        uiSamples2.textContent = uiSamples.textContent;
        uiPoints2.textContent = uiPoints.textContent;
      }

      function buildChart(rows) {
        const labels = rows.map(r => String(r.ts));
        const temps = rows.map(r => r.temp);

        const pointDots = rows.map(r => (r.ev === "point" ? r.temp : null));
        const pointCount = rows.reduce((acc, r) => acc + (r.ev === "point" ? 1 : 0), 0);

        uiSamples.textContent = String(rows.length);
        uiPoints.textContent = String(pointCount);
        syncUiMirrors();

        const ctx = document.getElementById("tempChart").getContext("2d");
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Temperature (°C)",
                data: temps,
                borderWidth: 2,
                fill: false,
                pointRadius: 0,
                pointHoverRadius: 0,
                tension: 0.25
              },
              {
                label: "Event: point",
                data: pointDots,
                showLine: false,
                pointRadius: 6,
                pointHoverRadius: 8
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", intersect: false },
            plugins: {
              legend: { display: true },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (context.dataset.label === "Event: point") {
                      return "Event: point";
                    }
                    return `Temperature: ${context.raw} °C`;
                  }
                }
              }
            },
            scales: {
              x: { ticks: { maxTicksLimit: 10 } },
              y: { title: { display: true, text: "°C" } }
            }
          }
        });
      }

      async function loadData() {
        const sessionId = getSessionId();
        const userId = getUserId();

        uiSessionId.textContent = sessionId > 0 ? String(sessionId) : "-";
        uiUserId.textContent = userId > 0 ? String(userId) : "-";
        syncUiMirrors();

        if (sessionId <= 0) {
          setStatus('Missing session_id. Use session_detail.html?session_id=123 (and optionally &user_id=1)');
          return;
        }
        if (userId <= 0) {
          setStatus("Missing user_id. Add ?user_id=... or set localStorage.user_id");
          return;
        }

        const url = `/api/sessions/${sessionId}/measurements?user_id=${encodeURIComponent(userId)}`;

        setStatus("Loading data...");
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            setStatus(`Failed to load: HTTP ${res.status}`);
            return;
          }

          const raw = await res.json();
          const rows = (Array.isArray(raw) ? raw : []).map(normalizeRow).filter(r => r.temp !== null);

          if (rows.length === 0) {
            setStatus("No data to show.");
            uiSamples.textContent = "0";
            uiPoints.textContent = "0";
            syncUiMirrors();
            if (chart) chart.destroy();
            chart = null;
            return;
          }

          buildChart(rows);
          setStatus(`Loaded ${rows.length} samples.`);
        } catch (e) {
          console.error(e);
          setStatus("Error loading data (check console).");
        }
      }

      btnReload.addEventListener("click", loadData);
      btnReload2.addEventListener("click", loadData);
      loadData();
    </script>
  </body>
</html>
